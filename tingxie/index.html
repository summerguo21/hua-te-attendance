<script>
(function(){
var $=function(id){return document.getElementById(id)};
var can=$('machine'),ctx=can.getContext('2d'),fx=$('fx'),fc=fx.getContext('2d');
var w=1672,h=941,pos=2,busy=false,sound=true,audio,master;
var spinStart=0,startPos=0,target=0,win=0,lastTick=-1,last=0,winAt=-10000;
var celebrating=false,burstTime=0,particles=[],pCount=0,rafOn=false,fxScale=1,coinSprite=null;

function prevent(e){e.preventDefault()}
document.addEventListener('contextmenu',prevent,false);
document.addEventListener('selectstart',prevent,false);

function resize(){
  var s=Math.min(innerWidth/1672,innerHeight/941);
  $('stage').style.transform='scale('+s+')';
  $('stage').style.left=(innerWidth-1672*s)/2+'px';
  $('stage').style.top=(innerHeight-941*s)/2+'px';
  can.width=w;
  can.height=h;
  ctx.setTransform(1,0,0,1,0,0);
  var longEdge=Math.max(innerWidth,innerHeight);
  fxScale=longEdge>1920?1920/longEdge:1;
  fx.width=Math.max(1,Math.round(innerWidth*fxScale));
  fx.height=Math.max(1,Math.round(innerHeight*fxScale));
  fx.style.width=innerWidth+'px';
  fx.style.height=innerHeight+'px';
  fc.setTransform(fxScale,0,0,fxScale,0,0);
  drawMachine(0);
}
addEventListener('resize',resize,false);

function showFx(on){
  fx.style.visibility=on?'visible':'hidden';
  if(!on)fc.clearRect(0,0,innerWidth+4,innerHeight+4);
}

function kick(){
  if(!rafOn){
    rafOn=true;
    last=0;
    requestAnimationFrame(frame);
  }
}

function initAudio(){
  try{
    if(!audio){
      audio=new (window.AudioContext||window.webkitAudioContext)();
      master=audio.createGain();
      master.gain.value=.55;
      master.connect(audio.destination);
    }
    var r=audio.resume();
    if(r&&r.catch)r.catch(function(){});
  }catch(e){
    $('notice').textContent='当前浏览器未开启音效，动画仍可正常使用';
  }
}

function tone(f,d,type,v,delay,end){
  if(d===undefined)d=.08;
  if(type===undefined)type='sine';
  if(v===undefined)v=.12;
  if(delay===undefined)delay=0;
  if(!audio||!sound)return;
  var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;
  o.type=type;
  o.frequency.setValueAtTime(f,t);
  if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t+d+.03);
  o.onended=function(){o.disconnect();g.disconnect()};
}

function prizeFromBucket(n){return n<30?1:n<60?2:n<80?3:n<90?4:5}
function randomPrize(){
  var a=new Uint32Array(1);
  do{crypto.getRandomValues(a)}while(a[0]>=4294967200);
  return prizeFromBucket(a[0]%100);
}

function spin(){
  if(busy||celebrating)return;
  busy=true;
  initAudio();
  win=randomPrize();
  startPos=pos;
  target=Math.ceil(pos/5)*5+35+(win-1);
  spinStart=performance.now();
  lastTick=Math.floor(pos);
  document.body.classList.remove('won');
  document.body.classList.add('spinning');
  $('start').disabled=true;
  $('start').textContent='能量加速中…';
  $('status').textContent='幸运引擎已启动';
  $('number').textContent='…';
  $('unit').textContent='ENERGY LOADING';
  $('caption').textContent='准备好，迎接你的高光时刻';
  tone(90,.9,'sawtooth',.08,0,650);
  [220,330,440].forEach(function(f,i){tone(f,.2,'triangle',.15,i*.15)});
  kick();
}

$('start').onclick=spin;
addEventListener('keydown',function(e){
  if(e.code==='Space'&&e.target===document.body){e.preventDefault();spin()}
},false);

$('sound').onclick=function(){
  sound=!sound;
  if(master)master.gain.value=sound ? .55 : 0;
  $('sound').textContent=sound?'♫ 音效开':'♫ 音效关';
  $('sound').setAttribute('aria-pressed',sound);
  if(sound){initAudio();tone(660)}
};

function isFullScreen(){
  return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||null;
}
function onFullChange(){
  $('full').textContent=isFullScreen()?'⛶ 退出全屏':'⛶ 全屏';
}
function toggleFull(){
  try{
    if(isFullScreen()){
      var exit=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
      if(!exit){ $('notice').textContent='可使用浏览器的全屏功能（F11）'; return; }
      var r=exit.call(document);
      if(r&&r.then)r.then(function(){},function(){ $('notice').textContent='可使用浏览器的全屏功能（F11）'; });
    }else{
      var el=document.documentElement;
      var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
      if(!req){ $('notice').textContent='可使用浏览器的全屏功能（F11）'; return; }
      var r2=req.call(el);
      if(r2&&r2.then)r2.then(function(){},function(){ $('notice').textContent='可使用浏览器的全屏功能（F11）'; });
    }
  }catch(err){
    $('notice').textContent='可使用浏览器的全屏功能（F11）';
  }
}
$('full').onclick=toggleFull;
document.addEventListener('fullscreenchange',onFullChange,false);
document.addEventListener('webkitfullscreenchange',onFullChange,false);

function addParticle(x,y,vx,vy,life,c,r,coin){
  var p;
  if(pCount<particles.length){
    p=particles[pCount];
    p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.c=c;p.r=r;p.coin=coin;
  }else{
    particles.push({x:x,y:y,vx:vx,vy:vy,life:life,c:c,r:r,coin:coin});
  }
  pCount++;
}

function burst(x,y,count,big){
  var i,a,v;
  for(i=0;i<count;i++){
    a=Math.random()*Math.PI*2;
    v=100+Math.random()*(big?520:320);
    addParticle(x,y,Math.cos(a)*v,Math.sin(a)*v-100,1.1+Math.random()*1.4,['#73ffff','#fc63e5','#e8ffb9','#ffffff'][i%4],2+Math.random()*5,big&&i%4===0);
  }
  showFx(true);
  kick();
}

function closeAward(){
  celebrating=false;
  $('celebrate').className='celebration';
  pCount=0;
  showFx(false);
  $('start').focus();
}
$('continue').onclick=closeAward;
addEventListener('keydown',function(e){
  if(e.key==='Escape'&&celebrating)closeAward();
},false);

function finish(t){
  busy=false;
  winAt=t;
  document.body.classList.remove('spinning');
  document.body.classList.add('won');
  $('start').disabled=false;
  $('start').textContent='再次启动';
  $('status').textContent='恭喜！满分奖励已解锁';
  $('number').textContent=win;
  $('unit').textContent='枚 华 特 币';
  $('caption').textContent='你的认真，闪闪发光！';
  $('announce').textContent='恭喜获得'+win+'枚华特币';
  celebrating=true;
  burstTime=t;
  $('celebrate').className='celebration show'+(win===5?' jackpot':'');
  $('awardTitle').textContent=win===5?'超级大奖 · 满分高光！':'满分奖励，已解锁！';
  $('awardNumber').textContent=win;
  $('awardMessage').textContent=win===5?'5枚华特币！这一刻，为你欢呼！':'每一份认真，都值得被看见';
  var html='',i;
  for(i=0;i<win;i++)html+='<span class="medal" style="animation-delay:'+(i*.13)+'s">★</span>';
  $('awardCoins').innerHTML=html;
  $('continue').focus();
  if(win===5){
    [523,659,784,1046,1318,1568,2093].forEach(function(f,i){
      tone(f,.8,'triangle',.18,.4+i*.16);
      tone(f/2,1,'sine',.12,1.7+i*.1);
    });
    tone(48,1.6,'sine',.3);
    burst(innerWidth*.5,innerHeight*.4,80,true);
  }else{
    burst(innerWidth*.5,innerHeight*.45,48,false);
  }
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,.6,'triangle',.22,i*.12)});
  tone(65,.7,'sine',.35);
  var cols=['#baff24','#00f5ff','#ff36d5','#ffffff'];
  for(i=0;i<48;i++){
    addParticle(innerWidth*.58,innerHeight*.51,(Math.random()-.5)*850,(Math.random()-.65)*700,1.6+Math.random()*1.2,cols[i%4],2+Math.random()*4,false);
  }
}

function makeCoinSprite(){
  var c=document.createElement('canvas');
  c.width=64;c.height=64;
  var x=c.getContext('2d');
  x.translate(32,32);
  var r=24;
  var g=x.createLinearGradient(-r,-r,r,r);
  g.addColorStop(0,'#f5ffff');
  g.addColorStop(.4,'#8096a9');
  g.addColorStop(.55,'#26354a');
  g.addColorStop(1,'#c4e6ee');
  x.beginPath();
  x.arc(0,0,r,0,Math.PI*2);
  x.fillStyle=g;
  x.fill();
  x.lineWidth=2;
  x.strokeStyle='#66faff';
  x.stroke();
  x.beginPath();
  x.arc(0,0,r*.78,0,Math.PI*2);
  x.fillStyle='#63788b';
  x.fill();
  x.lineWidth=1;
  x.strokeStyle='#d7f8ff';
  x.stroke();
  x.beginPath();
  var i,a,rr;
  for(i=0;i<10;i++){
    a=-Math.PI/2+i*Math.PI/5;
    rr=r*(i%2 ? .32 : .65);
    if(i===0)x.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
    else x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  x.closePath();
  x.fillStyle='#dcfaff';
  x.fill();
  coinSprite=c;
}

function coin(x,y,r){
  if(!coinSprite)makeCoinSprite();
  ctx.drawImage(coinSprite,x-r,y-r,r*2,r*2);
}

function drawMachine(t){
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(365,130);
  ctx.lineTo(875,150);
  ctx.bezierCurveTo(975,200,1015,330,1010,500);
  ctx.bezierCurveTo(1000,660,920,755,840,762);
  ctx.lineTo(362,762);
  ctx.bezierCurveTo(420,630,428,285,365,130);
  ctx.clip();
  var step=Math.PI/5,base=Math.floor(pos),j,a,n,yy,br,xx,k;
  ctx.font='italic 900 53px Microsoft YaHei';
  ctx.textBaseline='middle';
  for(j=base-3;j<=base+3;j++){
    a=(j-pos)*step;
    if(Math.abs(a)>1.55)continue;
    n=((j%5)+5)%5+1;
    yy=442+290*Math.sin(a);
    br=Math.cos(a);
    xx=432+14*Math.sin(a);
    ctx.save();
    ctx.translate(xx,yy);
    ctx.transform(1,.035,Math.sin(a)*.12,Math.max(.16,br),0,0);
    ctx.globalAlpha=.45+.55*br;
    ctx.fillStyle=Math.abs(a)<.2?'#c6e878':'#9aa8b0';
    ctx.fillText(n+'枚华特币',2,2);
    ctx.fillStyle='#f5ffff';
    ctx.fillText(n+'枚华特币',0,0);
    for(k=0;k<n;k++)coin(305+k*51,0,24);
    ctx.restore();
  }
  ctx.restore();
  if(busy){
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.strokeStyle='rgba(92,255,255,0.33)';
    ctx.lineWidth=2;
    for(var i=0;i<6;i++){
      var y=160+((t*.5+i*73)%590);
      ctx.beginPath();
      ctx.moveTo(450,y);
      ctx.lineTo(930,y+8);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function frame(t){
  var dt=Math.min(.04,(t-last)/1000||.016);
  last=t;
  var wasBusy=busy;
  if(busy){
    var u=Math.min(1,(t-spinStart)/6500);
    var e=u<.2?(1/9)*Math.pow(u/.2,3):(1/9)+(8/9)*(1-Math.pow(1-(u-.2)/.8,1.5));
    pos=startPos+(target-startPos)*e;
    var k=Math.floor(pos);
    if(k!==lastTick){
      lastTick=k;
      tone(260+(k%5)*55,.045,'square',.045);
    }
    if(u>.55){
      $('start').textContent='奖励锁定中…';
      $('status').textContent='好运正在靠近';
    }
    if(u===1){
      pos=target;
      finish(t);
    }
  }
  if(wasBusy)drawMachine(t);

  var burstWindow=win===5?8000:2400;
  var burstGap=win===5?700:800;
  if(celebrating&&t-winAt<burstWindow&&t-burstTime>burstGap){
    burstTime=t;
    burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.18+Math.random()*.45),win===5?28:16,win===5);
  }

  var age=t-winAt;
  var hasRing=age>=0&&age<1100;
  if(pCount>0||hasRing){
    fc.clearRect(0,0,innerWidth+4,innerHeight+4);
    var wwrite=0,i,p;
    for(i=0;i<pCount;i++){
      p=particles[i];
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      p.vy+=320*dt;
      p.life-=dt;
      if(p.life>0){
        fc.globalAlpha=p.life>1?1:p.life;
        fc.fillStyle=p.c;
        if(p.coin){
          fc.beginPath();
          fc.arc(p.x,p.y,p.r*2,0,Math.PI*2);
          fc.fill();
          fc.strokeStyle='#fff';
          fc.stroke();
        }else{
          fc.fillRect(p.x,p.y,p.r,p.r*2);
        }
        if(wwrite!==i){
          particles[i]=particles[wwrite];
          particles[wwrite]=p;
        }
        wwrite++;
      }
    }
    pCount=wwrite;
    fc.globalAlpha=1;
    if(hasRing){
      fc.strokeStyle='rgba(190,255,100,'+(1-age/1100)*.65+')';
      fc.lineWidth=3;
      fc.beginPath();
      fc.arc(innerWidth*.57,innerHeight*.5,age*.85+10,0,Math.PI*2);
      fc.stroke();
    }
  }

  var need=busy||pCount>0||hasRing||(celebrating&&(t-winAt<burstWindow));
  if(need)requestAnimationFrame(frame);
  else{
    rafOn=false;
    showFx(false);
    if(wasBusy)drawMachine(t);
  }
}

resize();
})();
</script>
</html>
